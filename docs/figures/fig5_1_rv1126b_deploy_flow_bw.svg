<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="940" viewBox="0 0 1600 940">
  <defs>
    <style>
      .title { font-family: 'Microsoft YaHei', 'SimSun', 'Times New Roman', serif; font-size: 30px; font-weight: 700; fill: #000; }
      .lane-title { font-family: 'Microsoft YaHei', 'SimSun', 'Times New Roman', serif; font-size: 22px; font-weight: 700; fill: #000; }
      .text { font-family: 'Microsoft YaHei', 'SimSun', 'Times New Roman', serif; font-size: 16px; font-weight: 400; fill: #000; }
      .small { font-family: 'Microsoft YaHei', 'SimSun', 'Times New Roman', serif; font-size: 14px; font-weight: 400; fill: #000; }
      .box { fill: #fff; stroke: #000; stroke-width: 2.4; }
      .lane { fill: none; stroke: #000; stroke-width: 2.8; }
      .arrow { fill: none; stroke: #000; stroke-width: 2.2; marker-end: url(#arrow); }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#000" />
    </marker>
  </defs>

  <rect x="0" y="0" width="1600" height="940" fill="#fff" />
  <text x="800" y="58" text-anchor="middle" class="title">图5-1 RV1126B端侧部署流程图</text>

  <!-- 三泳道外框 -->
  <rect x="50" y="100" width="420" height="760" rx="20" class="lane" />
  <rect x="590" y="100" width="420" height="760" rx="20" class="lane" />
  <rect x="1130" y="100" width="420" height="760" rx="20" class="lane" />
  <!-- 底边补线（防止渲染截断） -->
  <path d="M 70 860 L 450 860" class="lane" />
  <path d="M 610 860 L 990 860" class="lane" />
  <path d="M 1150 860 L 1530 860" class="lane" />

  <!-- 泳道标题 -->
  <text x="260" y="142" text-anchor="middle" class="lane-title">Windows主机</text>
  <text x="800" y="142" text-anchor="middle" class="lane-title">Ubuntu环境</text>
  <text x="1340" y="142" text-anchor="middle" class="lane-title">RV1126B板端</text>

  <!-- Windows 泳道：3个步骤框 -->
  <rect x="125" y="210" width="270" height="92" rx="14" class="box" />
  <text x="260" y="248" text-anchor="middle" class="text">模型训练结果</text>
  <text x="260" y="276" text-anchor="middle" class="small">exp07 EIoU / exp09 Ghost+EIoU</text>

  <rect x="125" y="360" width="270" height="110" rx="14" class="box" />
  <text x="260" y="402" text-anchor="middle" class="text">导出为onnx格式模型</text>
  <text x="260" y="430" text-anchor="middle" class="small">同步整理部署所需测试数据</text>

  <rect x="125" y="530" width="270" height="110" rx="14" class="box" />
  <text x="260" y="572" text-anchor="middle" class="text">校准数据准备</text>
  <text x="260" y="600" text-anchor="middle" class="small">FLIR验证集150张、多场景覆盖</text>

  <!-- Ubuntu 泳道：3个步骤框 -->
  <rect x="665" y="250" width="270" height="110" rx="14" class="box" />
  <text x="800" y="292" text-anchor="middle" class="text">模型格式转换</text>
  <text x="800" y="320" text-anchor="middle" class="small">onnx格式 → RKNN格式</text>

  <rect x="665" y="430" width="270" height="110" rx="14" class="box" />
  <text x="800" y="472" text-anchor="middle" class="text">INT8量化</text>
  <text x="800" y="500" text-anchor="middle" class="small">使用校准集完成量化</text>

  <rect x="665" y="610" width="270" height="110" rx="14" class="box" />
  <text x="800" y="652" text-anchor="middle" class="text">交叉编译部署程序</text>
  <text x="800" y="680" text-anchor="middle" class="small">生成可在板端运行的可执行程序</text>

  <!-- RV1126B 泳道：3个步骤框 -->
  <rect x="1205" y="250" width="270" height="110" rx="14" class="box" />
  <text x="1340" y="292" text-anchor="middle" class="text">推送部署文件</text>
  <text x="1340" y="320" text-anchor="middle" class="small">RKNN模型 / 可执行程序 / 测试数据</text>

  <rect x="1205" y="430" width="270" height="110" rx="14" class="box" />
  <text x="1340" y="472" text-anchor="middle" class="text">板端加载模型</text>
  <text x="1340" y="500" text-anchor="middle" class="small">初始化运行环境并准备推理</text>

  <rect x="1205" y="610" width="270" height="110" rx="14" class="box" />
  <text x="1340" y="652" text-anchor="middle" class="text">板端推理与跟踪</text>
  <text x="1340" y="680" text-anchor="middle" class="small">输出结果图像、视频与统计日志</text>

  <!-- Windows 泳道内纵向箭头 -->
  <path d="M 260 302 L 260 360" class="arrow" />
  <path d="M 260 470 L 260 530" class="arrow" />

  <!-- 跨泳道箭头1：Windows 导出 → Ubuntu 格式转换，标注"中间格式模型" -->
  <path d="M 395 415 L 520 415 L 520 305 L 665 305" class="arrow" />
  <text x="530" y="286" class="small">onnx格式模型</text>

  <!-- 跨泳道箭头2：Windows 校准数据 → Ubuntu INT8量化，标注"校准图片" -->
  <path d="M 395 585 L 540 585 L 540 485 L 665 485" class="arrow" />
  <text x="548" y="566" class="small">校准图片</text>

  <!-- Ubuntu 泳道内纵向箭头 -->
  <path d="M 800 360 L 800 430" class="arrow" />
  <path d="M 800 540 L 800 610" class="arrow" />

  <!-- 跨泳道箭头3：Ubuntu 交叉编译 → RV1126B 推送部署，标注"RKNN模型与程序" -->
  <path d="M 935 665 L 1070 665 L 1070 305 L 1205 305" class="arrow" />
  <text x="1080" y="286" class="small">RKNN模型与程序</text>

  <!-- RV1126B 泳道内纵向箭头 -->
  <path d="M 1340 360 L 1340 430" class="arrow" />
  <path d="M 1340 540 L 1340 610" class="arrow" />
</svg>